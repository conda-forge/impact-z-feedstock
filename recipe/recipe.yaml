schema_version: 1

context:
  name: impact-z
  version: "2.7.9"
  build: 0
  # mpi variants get a build string so packages can depend on them explicitly:
  # `pkg * mpi_mpich_*` for mpich, `pkg * mpi_*` for any mpi, `pkg * nompi_*` for no mpi
  mpi_prefix: ${{ "nompi" if mpi == "nompi" else "mpi_" ~ mpi }}
  # Redefine microarch_level from the build matrix as an integer
  microarch_level: ${{ microarch_level | default(1) | int }}
  # Build number encodes solver priority: openmpi beats mpich/nompi (+100),
  # and within each mpi variant a higher microarch level wins (+0..3).
  # Incrementing `build` (x1000) outranks everything from prior builds.
  #   nompi/mpich v1: 0    v3 (AVX2): 2    v4 (AVX512): 3
  #   openmpi    v1: 100   v3 (AVX2): 102  v4 (AVX512): 103
  build_number: 0
  # gcc/clang -march= name for the microarch level (x86-64, x86-64-v3,
  # x86-64-v4); empty on non-x86_64 platforms
  build_arch: ${{ "x86-64-v" ~ microarch_level if linux and x86_64 and microarch_level > 1 else "" }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/impact-lbl/IMPACT-Z/archive/V${{ version }}.tar.gz
  sha256: ef002768fd6e8154c431b3687f4966bc4aff148b0447a114c0f9749fce444d07

build:
  number: ${{ build_number }}
  string: ${{ mpi_prefix }}_h${{ hash }}_${{ build_number }}
  skip:
    - win
  script:
    file: build.sh
    env:
      BUILD_MICROARCH: ${{ build_arch }}

requirements:
  build:
    - make
    - ${{ stdlib("c") }}
    - ${{ compiler("c") }}
    - ${{ compiler("fortran") }}
    - if: linux and x86_64
      # NOTE: this is here for targeting AVX512 and lower (see
      # https://conda-forge.org/docs/maintainer/knowledge_base/#microarch)
      then: x86_64-microarch-level ==${{ microarch_level }}
    - cmake
    - if: mpi == "openmpi" and build_platform != target_platform
      then: openmpi
  host:
    - if: mpi != "nompi"
      then: ${{ mpi }}
    - fftw * ${{ mpi_prefix }}*
  run:
    - if: mpi != "nompi"
      then: ${{ mpi }}
  run_exports:
    - if: mpi != "nompi"
      then: ${{ name }} * ${{ mpi_prefix }}_*

tests:
  - script:
      - which ImpactZexe
      - if: mpi != "nompi"
        then: which ImpactZexe-mpi

about:
  homepage: https://github.com/impact-lbl/IMPACT-Z
  license: BSD-3-Clause-LBNL
  license_file: license.txt
  summary: IMPACT-Z - Integrated Map and Particle ACcelerator Tracking Code
  description: |
    IMPACT-Z is a parallel+serial particle-in-cell code whose primary purpose
    is to model the dynamics of multiple charged particle beams in linear and
    ring accelerators. The code uses longitudinal position (z) as independent
    variable and includes the effects of externally applied fields from magnets
    and accelerating cavities as well as the effect of self-fields (space
    charge fields).
  documentation: https://github.com/impact-lbl/IMPACT-Z/tree/master/doc
  repository: https://github.com/impact-lbl/IMPACT-Z

extra:
  feedstock-name: impact-z
  recipe-maintainers:
    - ken-lauer
    - hhslepicka
    - ChristopherMayes
